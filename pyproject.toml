[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verificador-integridade"
version = "1.0.0"
description = "Inventários de arquivos e comparação com SHA-256"
requires-python = ">=3.10"

[project.scripts]
verificar-integridade = "integridade.cli:main"

[tool.setuptools.packages.find]
include = ["integridade*"]
